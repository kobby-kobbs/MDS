[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mds"
version = "0.1.0"
description = "Model Distribution Service — REST API for distributing ML models to customers"
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "uvicorn",
    "gunicorn",
    "pyjwt",
    "cryptography",
    "python-multipart",
    "azure-storage-blob",
    "azure-ai-ml",
    "azure-identity",
    "requests",
    "cachetools",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "httpx",
    "ruff",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "integration: end-to-end tests requiring a running server",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
